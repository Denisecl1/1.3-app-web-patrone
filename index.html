<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Identificador de patrones con IA</title>

    <link rel="stylesheet" href="assets/css/styles.css">

<body>


    <main class="app">

        <header class="header">

            <div>

                <h1>Analizador visual IA</h1>

                <p>Identificación de patrones y objetos en imágenes</p>

            </div>

            <span id="statusText" class="status">● IA disponible</span>

        </header>


        <form id="analyzeForm" class="content">

            <section class="panel">

                <div class="field">
                    <label>1. Selecciona una imagen</label>
                    
                    <!-- 1. Ocultamos el input original con style="display: none;" -->
                    <input
                        id="imageInput"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        required
                        style="display: none;"
                    >
                    
                    <!-- 2. Convertimos tu botón en un <label> conectado al input -->
                    <label for="imageInput" class="button" style="width: 100%;">
                      <div style="width: 100%;">
                        <div style="width: 100%; justify-content: center;">
                          <div id="fileNameDisplay">Seleccionar archivo</div>
                        </div>
                      </div>
                    </label>
                </div>


                <img id="preview" class="preview" alt="Vista previa de la imagen">


                <div class="field">

                    <label for="promptInput">2. ¿Qué quieres identificar?</label>

                    <textarea

                        id="promptInput"

                        maxlength="500"

                        placeholder="Ejemplo: identifica los objetos y estima cuántos hay de cada tipo."

                    ></textarea>

                </div>
